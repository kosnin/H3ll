<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H3ll</title>
    <meta name="description" content="H3ll - 3D高難易度回避アクションゲーム">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Noto+Sans+JP:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- Title Screen -->
        <div id="title-screen" class="screen">
            <h1 class="title">H3ll</h1>
            <p class="instruction">CLICK TO START</p>
            <button id="ranking-btn" class="ui-btn ranking-btn">Ranking</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div id="timer">0.00</div>
        </div>

        <!-- Death Screen -->
        <div id="death-screen" class="screen hidden">
            <h1 id="death-title" class="death-title">YOU DIED</h1>
            <div class="score-row">
                <p id="survival-time" class="survival-time"></p>
                <button id="register-btn" class="ui-btn register-btn">Register</button>
            </div>
            <div id="register-form" class="register-form hidden">
                <input id="username-input" type="text" placeholder="User name" maxlength="16" class="username-input" />
                <button id="submit-register-btn" class="ui-btn submit-btn">Register</button>
            </div>
            <p class="restart-instruction">CLICK TO RETRY</p>
        </div>

        <!-- Ranking Screen -->
        <div id="ranking-screen" class="screen hidden">
            <h2 class="ranking-title">RANKING</h2>
            <div id="ranking-list" class="ranking-list"></div>
            <button id="ranking-close-btn" class="ui-btn ranking-close-btn">Close</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js",
            "firebase/analytics": "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
